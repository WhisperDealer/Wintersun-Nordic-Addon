name: Build & Package

# Builds the two release archives (addon + patch collection) from Spriggit YAML and the
# committed .pex. On main it is only a smoke test — nothing is published; a `v*` tag is the one
# and only thing that cuts a GitHub Release. Test builds for review are the PR artifacts from
# pr-build.yml. Papyrus is NOT compiled here — the .pex are committed (recompile + commit locally
# when a .psc changes; see README "CI build").
#
# The Spriggit CLI version is read from .spriggit by the composite action — do not pin it here.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:                  # manual rebuild without pushing anything

permissions:
  contents: write   # create the Release on a v* tag

concurrency:
  group: build-${{ github.ref }}
  # Superseded main builds are worth cancelling; a tag build is cutting a real release and must
  # never be killed half-way through uploading its assets.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build mod archives
        uses: ./.github/actions/build-mod-archives
        with:
          github-token: ${{ github.token }}

      - name: Create Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # @(...) is required: with exactly one archive this collapses to a scalar string,
          # and splatting a scalar passes its first character as the argument instead of the path.
          $assets = @(Get-ChildItem build/dist/*.7z | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No archives in build/dist - nothing to release." }
          gh release create "$env:GITHUB_REF_NAME" @assets `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes
