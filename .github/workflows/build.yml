name: Build & Package

# Builds the two release archives (addon + patch collection) from Spriggit YAML and the
# committed .pex, on every push to main and on version tags. Papyrus is NOT compiled here —
# the .pex are committed (recompile + commit locally when a .psc changes; see README "CI build").
#
# The Spriggit CLI version is read from .spriggit by the composite action — do not pin it here.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'arch-docs/build-report.md'   # loop guard: the report commit must not re-trigger
    tags:
      - 'v*'
  workflow_dispatch:                  # manual rebuild without pushing anything

permissions:
  contents: write   # commit build-report.md back to main; create Releases (timestamped on main, v* on tags)

concurrency:
  group: build-${{ github.ref }}
  # Superseded main builds are worth cancelling; a tag build is cutting a real release and must
  # never be killed half-way through uploading its assets.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build mod archives
        uses: ./.github/actions/build-mod-archives
        with:
          github-token: ${{ github.token }}

      - name: Create timestamped Release (main only)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $now   = (Get-Date).ToUniversalTime()
          $tag   = 'build-' + $now.ToString('yyyyMMdd-HHmmss')
          $title = $now.ToString('yyyy-MM-dd HH:mm:ss') + ' UTC'
          # @(...) is required: with exactly one archive this collapses to a scalar string,
          # and splatting a scalar passes its first character as the argument instead of the path.
          $assets = @(Get-ChildItem build/dist/*.7z | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No archives in build/dist - nothing to release." }
          gh release create "$tag" @assets `
            --target "$env:GITHUB_SHA" `
            --title "$title" `
            --notes "Automated rolling build of commit $env:GITHUB_SHA on main." `
            --prerelease

      - name: Commit build report (main only)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arch-docs/build-report.md
          if (git diff --cached --quiet) {
            Write-Host 'build-report.md unchanged; nothing to commit.'
          } else {
            git commit -m 'ci: update build report [skip ci]'
            git push
          }

      - name: Create Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # @(...) is required: with exactly one archive this collapses to a scalar string,
          # and splatting a scalar passes its first character as the argument instead of the path.
          $assets = @(Get-ChildItem build/dist/*.7z | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No archives in build/dist - nothing to release." }
          gh release create "$env:GITHUB_REF_NAME" @assets `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes
