    Follow the Nordic God Tsun?


    Tsun is the God of Trials Against Adversity and guardian of the Whale Bone Bridge.


    Follower:

    Deal more damage and take less damage from foes whose level is above your own.


    Tenets:

    Honor your foes in open combat, especially those stronger than you. Never openly break the laws of Skyrim.
